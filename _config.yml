site: Harsh Browns
url: https://visitmy.website
title: Harsh Browns
description: Steve Messer’s website.
default_img: /assets/images/8a595a78177bf62b.jpeg
author:
  twitter: stevenjmesser
  name: Steve Messer
  avatar:
  email: #youremail
  url: https://visitmy.website

permalink: pretty

highlighter: none

exclude:
  - .jekyll-cache
  - .ai_related_posts_cache.sqlite3-journal
  - .ai_related_posts_cache.sqlite3
  
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir:          _sass
  style:            :compressed

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll_ai_related_posts
  - jekyll-webmention_io
  - jekyll-aeo

collections:
  pages:
    output: true
    permalink: /:name/
  posts:
    output: true
    permalink: /:year/:month/:day/:slug/
  
webmentions:
  username: visitmy.website
  max_attempts: 3
  throttle_lookups:
    last_week: daily
    last_month: monthly
    last_year: monthly
    older: every 3 months

ai_related_posts:
  embedding_model: text-embedding-granite-embedding-278m-multilingual
  summary_model: google/gemma-3-4b
  lm_studio_url: http://127.0.0.1:1234
  embedding_dimensions: 768
  summary_enabled: true
  summary_max_chars: 5000

markdown: kramdown

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"