name: Post Accessibility Report as Issue

on:
  push:
    branches:
      - copilot/run-accessibility-check
    paths:
      - 'accessibility-report.md'

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create accessibility issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('accessibility-report.md', 'utf8');

            // Check for an existing open issue with this title to avoid duplicates
            const title = 'Accessibility Audit Report (Playwright + axe-core)';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const duplicate = existing.data.find(i => i.title === title);
            if (duplicate) {
              core.info(`Issue already exists: ${duplicate.html_url}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['accessibility'],
            });
            core.info(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
